<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Plan semanal TIC</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <span class="mark">TIC</span>
        <div>
          <strong>Plan semanal</strong>
          <small>Tecnología</small>
        </div>
      </div>
      <div class="search-wrap">
        <input id="q" type="search" placeholder="Buscar tarea, nota o persona" autocomplete="off" aria-label="Buscar en todas las semanas">
        <div id="search-results" hidden></div>
      </div>
      <nav id="weeks" aria-label="Semanas"></nav>
      <div class="side-foot">
        <button id="btn-people" type="button">Personal</button>
        <p id="meta"></p>
      </div>
    </aside>
    <main id="main">
      <div id="content" class="content"><p class="note">Cargando el plan…</p></div>
    </main>
  </div>
  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawer-title">Tarea</h2>
      <button type="button" id="drawer-close">Cerrar</button>
    </div>
    <div id="drawer-body"></div>
  </aside>
  <div id="toast" class="toast" hidden role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
